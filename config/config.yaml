directory: ~/Projects/data/media/music
library: ~/.config/beets/musiclibrary.db
plugins: musicbrainz acoustid chroma lastgenre

import:
  move: no       # critical
  copy: no       # critical
  write: yes
  quiet: yes
  timid: no
  autotag: yes

chroma:
  auto: no
acoustid:
  apikey: bcPOEMhUUd

lastgenre:
  auto: yes
  canonical: yes
  cleanup_existing: no
  count: 5
  fallback: null
  force: yes
  keep_existing: no
  min_weight: 10
  prefer_specific: yes
  source: album
  whitelist: yes
  title_case: yes
  ignorelist: no
  aliases: yes

musicbrainz:
  host: musicbrainz.org
  https: no
  ratelimit: 1
  ratelimit_interval: 1.0
  extra_tags: [alias, barcode, catalognum, country, label, media, tracks, year]
  genres: no
  genres_tag: genre
  external_ids:
    discogs: no
    bandcamp: no
    spotify: no
    deezer: no
    beatport: no
    tidal: no
  data_source_mismatch_penalty: 0.3 # preferred
  search_limit: 5
  aliases_as_credits: no

